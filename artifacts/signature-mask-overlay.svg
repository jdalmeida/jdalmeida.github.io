    <text x="0" y="0" class="eyebrow">LEITURA</text>
    <circle cx="8" cy="43" r="8" fill="#c45938"/><text x="30" y="49" class="body">m5 revela o vetor p5 (“m”).</text>
    <circle cx="8" cy="86" r="8" fill="#2f6fa5"/><text x="30" y="92" class="body">m6 revela p6 (“e+i”).</text>
    <circle cx="8" cy="129" r="8" fill="#4d8561"/><text x="30" y="135" class="body">m7 revela p7 (“d”).</text>
    <circle cx="8" cy="172" r="8" fill="#4c5b41"/><text x="30" y="178" class="body">m10 revela o ponto do “i”.</text>
    <path d="M0 220H470" stroke="#d9c9a0" stroke-width="2"/>
    <text x="0" y="258" class="body">A zona densa não vem só de m6.</text>
    <text x="0" y="291" class="body">Os strokes largos de m5, m6 e m7</text>
    <text x="0" y="324" class="body">se cruzam visualmente no mesmo trecho.</text>
    <text x="0" y="370" class="small">Importante: cada máscara ainda recorta apenas</text>
    <text x="0" y="394" class="small">seu próprio pN; o problema é a cobertura excessiva</text>
    <text x="0" y="418" class="small">dos guias em vetores que já se encostam.</text>
