{{ define "blog" }}
<!doctype html>
<html lang="pt-BR">
{{ template "head" . }}
<body>
  {{ template "site-header" . }}
  <main id="topo" class="page-main">
    <header class="archive-header">
      <div>
        <p class="eyebrow">arquivo</p>
        <h1>Artigos</h1>
      </div>
      <p>Reflexões e notas sobre engenharia de software, inteligência artificial e o ofício de construir coisas digitais.</p>
    </header>
    <section class="archive-shell" aria-label="Arquivo de artigos">
      {{ template "blog-results" . }}
    </section>
  </main>
  {{ template "site-footer" . }}
</body>
</html>
{{ end }}
